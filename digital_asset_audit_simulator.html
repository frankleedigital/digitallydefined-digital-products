<style id="dd-brand-standard">
/* ============================================================================
   DigitallyDefined — Official Brand Standard v2.0
   Source of truth for every digital product. See brand/README.md.
   Inlined into each product's <style id="dd-brand-standard"> by
   scripts/apply_brand.py — do not hand-edit the copies.

   Spec (from the official brand file):
     • 3-colour system: #F18B25 primary, #47B7D4 secondary, #C20F0A important
     • 1px solid #111111 frame on every card, button, badge, input
     • rounded-none: 0px radius everywhere
     • flat: no box-shadows, no gradients-as-decoration
     • Inter 900 italic "DEFINED." logotype beside upright "DIGITALLY"
     • Inter for headings / UI / buttons, DM Sans for body copy
     • Outcome-first, non-technical, Gen X voice
   ========================================================================= */

:root {
  /* ── 1. Brand roles ─────────────────────────────────────────────────── */
  --dd-orange: #F18B25 !important;   /* PRIMARY   — CTAs, active state, default accent */
  --dd-blue:   #47B7D4 !important;   /* SECONDARY — supporting modules, metrics, tech */
  --dd-red:    #C20F0A !important;   /* IMPORTANT — alerts, security, critical only  */

  /* ── 2. Surfaces ────────────────────────────────────────────────────── */
  --dd-bg:             #FFFCF9 !important;  /* page */
  --dd-card:           #FFFFFF !important;  /* card / panel face */
  --dd-panel:          #FFFAF5 !important;  /* inset well */
  --dd-dark:           #0F0F0F !important;  /* brutal-dark block */
  --dd-accent-surface: #FFFFC9 !important;  /* brand banner strip */

  /* Derived washes — tints of the 3 roles, no new hues introduced */
  --dd-wash-orange: #FFF0DE !important;
  --dd-wash-blue:   #E6F5F9 !important;
  --dd-wash-red:    #FBEAEA !important;

  /* ── 3. Ink & line ──────────────────────────────────────────────────── */
  --dd-ink:   #111111 !important;
  --dd-muted: #5F5F5F !important;
  --dd-line:  #111111 !important;
  --dd-bdr:   #111111 !important;   /* colour only — pair with `1px solid` */

  /* ── 4. Structure: always square, always flat ───────────────────────── */
  --dd-radius: 0px !important;
  --dd-shadow: none !important;

  /* ── 5. Type ────────────────────────────────────────────────────────── */
  --dd-font-head: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif !important;
  --dd-font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif !important;

  /* ── 6. Legacy aliases ──────────────────────────────────────────────────
     Every variable name used across the catalogue, pointing at the token
     it should have been. Colour tokens only — structural vars are colours,
     and every `border:` declaration is rewritten to `1px solid var(...)`
     so the shorthand can never resolve to an invalid value.              */
  --bg: var(--dd-bg) !important;
  --cream-bg: var(--dd-bg) !important;
  --cream: var(--dd-bg) !important;
  --card-bg: var(--dd-card) !important;
  --card: var(--dd-card) !important;
  --dd-card-bg: var(--dd-card) !important;
  --pure-white: #FFFFFF !important;
  --white: #FFFFFF !important;
  --dd-white: #FFFFFF !important;
  --panel: var(--dd-panel) !important;
  --light-gray: var(--dd-panel) !important;

  --text: var(--dd-ink) !important;
  --dd-text: var(--dd-ink) !important;
  --ink: var(--dd-ink) !important;
  --dk: var(--dd-ink) !important;
  --black: var(--dd-ink) !important;
  --dark-grey: var(--dd-ink) !important;
  --medium-grey: var(--dd-muted) !important;
  --muted: var(--dd-muted) !important;

  --border: var(--dd-line) !important;
  --dd-border: var(--dd-line) !important;
  --bdr: var(--dd-line) !important;
  --line: var(--dd-line) !important;
  --frame: var(--dd-line) !important;
  --dd-frame: var(--dd-line) !important;
  --dd-frame-sm: var(--dd-line) !important;
  --black-border: var(--dd-line) !important;
  --border-gray: var(--dd-line) !important;

  --or: var(--dd-orange) !important;
  --orange: var(--dd-orange) !important;
  --orange-highlight: var(--dd-orange) !important;
  --accent: var(--dd-orange) !important;
  --primary: var(--dd-orange) !important;

  --bl: var(--dd-blue) !important;
  --aqua: var(--dd-blue) !important;
  --dd-aqua: var(--dd-blue) !important;
  --aqua-blue: var(--dd-blue) !important;
  --secondary: var(--dd-blue) !important;
  --dd-accent-primary: var(--dd-orange) !important;
  --dd-accent-secondary: var(--dd-blue) !important;

  --rd: var(--dd-red) !important;
  --red: var(--dd-red) !important;
  --deep-red-warning: var(--dd-red) !important;
  --tertiary: var(--dd-red) !important;
  --dd-accent-tertiary: var(--dd-red) !important;

  --dark: var(--dd-dark) !important;

  --font-head: var(--dd-font-head) !important;
  --font-body: var(--dd-font-body) !important;
  --font-sans: var(--dd-font-body) !important;
  --font-mono: var(--dd-font-head) !important;
}

/* ── Flat + square: the two non-negotiable brutalist rules ─────────────── */
*,
*::before,
*::after {
  border-radius: 0px !important;
  box-shadow: none !important;
  text-shadow: none !important;
}

/* ── Type system ───────────────────────────────────────────────────────── */
body {
  background-color: var(--dd-bg) !important;
  color: var(--dd-ink) !important;
  font-family: var(--dd-font-body) !important;
  -webkit-font-smoothing: antialiased !important;
  -moz-osx-font-smoothing: grayscale !important;
}

h1, h2, h3, h4, h5, h6, .dd-h {
  font-family: var(--dd-font-head) !important;
  color: var(--dd-ink) !important;
  letter-spacing: -0.025em !important;
}

h1, h2, h3 { font-weight: 900 !important; }
h4, h5, h6 { font-weight: 800 !important; }

/* Body copy stays DM Sans — inputs included, so nothing falls back to Arial */
p, li, td, dd, dt, blockquote, figcaption,
input, select, textarea, optgroup, option {
  font-family: var(--dd-font-body);
}

/* Action controls are Inter, 800 — per spec */
button,
.btn,
.cta,
.dd-btn,
input[type="submit"],
input[type="button"] {
  font-family: var(--dd-font-head) !important;
  font-weight: 800 !important;
  letter-spacing: 0.02em !important;
}

/* Third typefaces retired: Inter covers metric / label duty */
code, pre, kbd, samp,
.mono, .font-mono, .dd-badge, .badge, .tag, .eyebrow {
  font-family: var(--dd-font-head) !important;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em !important;
}

/* ── 1px frame for every Tailwind border-width utility ─────────────────── */
.border-2, .border-4, .border-8 { border-width: 1px !important; }
.border-t-2, .border-t-4 { border-top-width: 1px !important; }
.border-b-2, .border-b-4 { border-bottom-width: 1px !important; }
.border-l-2, .border-l-4 { border-left-width: 1px !important; }
.border-r-2, .border-r-4 { border-right-width: 1px !important; }
.border-x-2, .border-x-4 { border-left-width: 1px !important; border-right-width: 1px !important; }
.border-y-2, .border-y-4 { border-top-width: 1px !important; border-bottom-width: 1px !important; }

/* ── Focus state: brand orange, always visible (shadows are gone) ─────── */
:focus-visible,
input:focus, select:focus, textarea:focus, button:focus, a:focus {
  outline: 2px solid var(--dd-orange) !important;
  outline-offset: 2px !important;
}

/* ── Official brand bar ───────────────────────────────────────────────── */
.dd-brandbar {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 12px !important;
  flex: 0 0 auto !important;
  width: 100% !important;
  padding: 10px 16px !important;
  background: var(--dd-card) !important;
  border: 0 !important;
  border-bottom: 1px solid var(--dd-line) !important;
  font-family: var(--dd-font-head) !important;
}

.dd-brandmark {
  display: inline-block;
  font-family: var(--dd-font-head) !important;
  font-weight: 900 !important;
  font-size: 15px;
  line-height: 1;
  letter-spacing: -0.04em;
  text-transform: uppercase;
  color: var(--dd-ink);
  text-decoration: none;
}

.dd-brandmark em {
  font-style: italic;
  color: var(--dd-orange);
}

.dd-brandbar-label {
  font-family: var(--dd-font-head) !important;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dd-muted);
  text-align: right;
}

/* Existing in-page logo slots are upgraded to the official lockup */
.dd-logo-name,
.logo-text {
  font-family: var(--dd-font-head) !important;
  font-weight: 900 !important;
  letter-spacing: -0.04em !important;
  text-transform: uppercase;
}

.dd-logo-name em,
.logo-text em {
  font-style: italic !important;
  color: var(--dd-orange) !important;
}

@media print {
  .dd-brandbar { display: none !important; }
}

</style>

    <div class="traffic-row"><span class="traffic-src">Google SEO</span><div class="traffic-bar-wrap"><div class="traffic-bar${t.google>55?' bad':t.google>40?' warn':''}" style="width:${t.google}%"></div></div><span class="traffic-num">${pct(t.google)}</span></div>
    <div class="traffic-row"><span class="traffic-src">Pinterest</span><div class="traffic-bar-wrap"><div class="traffic-bar" style="width:${t.pinterest}%"></div></div><span class="traffic-num">${pct(t.pinterest)}</span></div>
    <div class="traffic-row"><span class="traffic-src">Social</span><div class="traffic-bar-wrap"><div class="traffic-bar${t.social>30?' warn':''}" style="width:${t.social}%"></div></div><span class="traffic-num">${pct(t.social)}</span></div>
    <div class="traffic-row"><span class="traffic-src">Direct</span><div class="traffic-bar-wrap"><div class="traffic-bar" style="width:${t.direct}%"></div></div><span class="traffic-num">${pct(t.direct)}</span></div>
    <div class="divider"></div>
    <div class="card-hdr" style="margin:0 -16px 12px;padding:8px 16px;font-size:11px">Content & Technical Status</div>
    <div class="content-row"><span class="content-key">Original Content</span><span class="content-val">${s.content.original&!s.content.plr?'<span class="tag green">YES</span>':'<span class="tag red">NO / PLR RISK</span>'}</span></div>
    <div class="content-row"><span class="content-key">Legal Pages</span><span class="content-val">${s.content.legalPages?'<span class="tag green">Privacy · Disclosure · Terms</span>':'<span class="tag red">MISSING</span>'}</span></div>
    <div class="content-row"><span class="content-key">Theme</span><span class="content-val">${s.content.theme}</span></div>
    <div class="content-row"><span class="content-key">Ad Network</span><span class="content-val"><span class="tag blue">${s.content.adNetwork}</span></span></div>
    <div class="content-row"><span class="content-key">Social Notes</span><span class="content-val" style="max-width:220px;text-align:right;font-size:12px">${s.socialNotes}</span></div>
  </div>
</div>
<p class="note">Study the numbers carefully. In the next step you'll flag the real risks hiding in this listing.</p>
<button class="btn orange" onclick="goAudit()">Start Risk Audit →</button>`;
}

function renderStage1(){
  const s=site();
  return`
<div class="card">
  <div class="card-hdr"><span>Risk Audit — Flag Real Red Flags</span><span style="color:#F18B25">SELECT ALL THAT APPLY</span></div>
  <div class="card-body">
    <p class="note" style="margin-bottom:12px">Click every item you believe is a genuine, deal-breaking risk. Not all of these are real traps — some are distractors. Precision matters.</p>
    ${s.risks.map(r=>`
    <div class="risk-item${state.flagged.has(r.id)?' flagged':''}" id="ri_${r.id}" onclick="toggleFlag('${r.id}')">
      <div class="risk-check${state.flagged.has(r.id)?' flagged':''}">${state.flagged.has(r.id)?'✓':''}</div>
      <div><div class="risk-label">${r.label}</div><div class="risk-desc">${r.desc}</div></div>
    </div>`).join('')}
  </div>
</div>
<button class="btn orange" onclick="submitAudit()">Submit Audit →</button>`;
}

function renderStage2(){
  return`
<div class="card">
  <div class="card-hdr"><span>Valuation Test</span><span style="color:#47B7D4">CALCULATE FMV</span></div>
  <div class="card-body">
    <p class="note">Standard niche site valuation = Net Monthly Profit × a multiple (24× to 36×). Choose your multiple based on site quality, then enter your Fair Market Value.</p>
    <div style="margin-bottom:14px">
      <div style="font-family:'Inter', sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#5F5F5F;margin-bottom:8px">Choose Multiplier</div>
      <div class="val-range">
        ${[24,28,30,33,36].map(m=>`<button class="mult-btn${state.multiplier===m?' sel':''}" onclick="setMult(${m})">${m}×</button>`).join('')}
      </div>
    </div>
    <div style="margin-bottom:8px">
      <div style="font-family:'Inter', sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#5F5F5F;margin-bottom:8px">Your Valuation</div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <input class="val-input" type="number" placeholder="e.g. 24000" id="val-inp" value="${state.valInput}" oninput="state.valInput=this.value"/>
        <span style="font-family:'DM Sans', sans-serif;font-size:13px;color:#5F5F5F">= ${fmt(profit())} profit × ${state.multiplier}× = <strong>${fmt(profit()*state.multiplier)}</strong></span>
      </div>
    </div>
    <div style="margin-top:12px;padding:10px 14px;border: 1px solid #111111;background:#FFFAF5">
      <div style="font-family:'Inter', sans-serif;font-size:10px;font-weight:700;color:#5F5F5F;text-transform:uppercase;margin-bottom:4px">Fair Value Range (for reference)</div>
      <div style="font-family:'Inter', sans-serif;font-size:15px;font-weight:700;color:#111">${fmt(fairLow())} – ${fmt(fairHigh())}</div>
    </div>
  </div>
</div>
<button class="btn orange" onclick="submitVal()">Submit Valuation →</button>`;
}

function renderStage3(){
  const s=site();
  const realRisks=s.risks.filter(r=>r.real);
  const correctFlags=realRisks.filter(r=>state.flagged.has(r.id));
  const falseFlags=s.risks.filter(r=>!r.real&state.flagged.has(r.id));
  const missed=realRisks.filter(r=>!state.flagged.has(r.id));
  const auditScore=Math.round((correctFlags.length/realRisks.length)*40)-(falseFlags.length*10);
  const valNum=parseInt(state.valInput)||0;
  const valOk=valNum>=fairLow()*0.85&valNum<=fairHigh()*1.15;
  const multOk=state.multiplier>=24&state.multiplier<=36;
  const valScore=valOk?30:valNum<fairLow()*0.5||valNum>fairHigh()*2?5:15;
  const roundScore=Math.max(0,auditScore)+valScore;
  state.score+=roundScore;
  updateScore();
  return`
<div class="result-box">
  <div class="score-ring">
    <div><div class="result-label">Round Score</div><div class="score-big">${Math.max(0,roundScore)}</div><div class="score-sub">of 70 possible pts</div></div>
    <div style="flex:1;min-width:160px">
      <div style="font-family:'DM Sans', sans-serif;font-size:13px;color:#5F5F5F;margin-bottom:6px">Running total</div>
      <div style="font-family:'Inter', sans-serif;font-size:22px;font-weight:700;color:#F18B25">${state.score} pts</div>
      <div style="font-family:'DM Sans', sans-serif;font-size:12px;color:#5F5F5F;margin-top:4px">Round ${state.round} of 4</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-hdr">Audit Results</div>
  <div class="card-body">
    ${correctFlags.map(r=>`<div class="feedback pass"><div class="fb-title">✓ Correctly Flagged</div><div class="fb-body"><strong>${r.label}</strong> — real risk. ${r.desc}</div></div>`).join('')}
    ${falseFlags.map(r=>`<div class="feedback warn"><div class="fb-title">⚠ False Flag</div><div class="fb-body"><strong>${r.label}</strong> — this was a distractor. −10 pts for noise.</div></div>`).join('')}
    ${missed.map(r=>`<div class="feedback fail"><div class="fb-title">✗ Missed Risk</div><div class="fb-body"><strong>${r.label}</strong> — you missed this one. ${r.desc}</div></div>`).join('')}
    ${correctFlags.length===realRisks.length&falseFlags.length===0?`<div class="feedback pass"><div class="fb-title">Perfect Audit</div><div class="fb-body">All real risks identified, zero false alarms. +40 pts.</div></div>`:''}
  </div>
</div>

<div class="card">
  <div class="card-hdr">Valuation Results</div>
  <div class="card-body">
    <div class="grid2" style="margin-bottom:12px">
      <div class="metric"><div class="metric-label">Your Valuation</div><div class="metric-val ${valOk?'green':'red'}">${fmt(valNum||0)}</div></div>
      <div class="metric"><div class="metric-label">Fair Range</div><div class="metric-val orange">${fmt(fairLow())}–${fmt(fairHigh())}</div></div>
    </div>
    ${valOk?`<div class="feedback pass"><div class="fb-title">✓ Accurate Valuation</div><div class="fb-body">Your figure of ${fmt(valNum)} sits within the 24×–36× fair value range. +30 pts.</div></div>`:
    `<div class="feedback fail"><div class="fb-title">✗ Off-Range Valuation</div><div class="fb-body">Fair value is ${fmt(fairLow())}–${fmt(fairHigh())}. Your figure of ${fmt(valNum)} missed the range. ${valNum>fairHigh()*1.15?'Overpaying destroys returns.':'Lowballing loses deals unnecessarily.'}</div></div>`}
    <div class="note" style="margin-top:12px">Rule: Net profit = ${fmt(profit())} × 24 = ${fmt(profit()*24)} floor. × 36 = ${fmt(profit()*36)} ceiling. Only pay above 36× for irreplaceable moats.</div>
  </div>
</div>

<div style="display:flex;gap:12px;flex-wrap:wrap">
  ${state.round<4?`<button class="btn orange" onclick="nextRound()">Next Site →</button>`:`<button class="btn orange" onclick="finalScore()">See Final Score →</button>`}
  <button class="btn outline" onclick="sendPrompt('I just finished round ${state.round} of the Digital Asset Auditing Simulator with a score of ${Math.max(0,roundScore)} pts on site ${s.name}. Can you give me a deeper breakdown of why ${s.traps.join(' and ')} are the most dangerous traps in this type of acquisition?')">Deep Dive ↗</button>
</div>`;
}

function renderFinal(){
  const max=state.round*70;
  const pct=Math.round((state.score/max)*100);
  const grade=pct>=80?'Acquisition Analyst':pct>=60?'Deal Scout':pct>=40?'Junior Auditor':'Apprentice';
  return`
<div class="result-box">
  <div class="result-label">Final Score</div>
  <div class="score-big">${state.score} / ${max}</div>
  <div class="score-sub" style="margin-top:6px">${pct}% accuracy · Rank: <span style="color:#fff;font-weight:700">${grade}</span></div>
</div>
<div class="card">
  <div class="card-hdr">What Your Score Means</div>
  <div class="card-body">
    ${pct>=80?`<div class="feedback pass"><div class="fb-title">Acquisition Analyst — Ready to Buy</div><div class="fb-body">You're catching real risks, avoiding distractors, and valuing accurately. You can approach real listings on Flippa, Motion Invest, or Empire Flippers with a trained eye.</div></div>`:
    pct>=60?`<div class="feedback warn"><div class="fb-title">Deal Scout — Getting Sharper</div><div class="fb-body">Good instincts on risk, but valuation precision needs work. Run the simulator again focusing on the 24×–36× multiple logic and traffic diversification scoring.</div></div>`:
    `<div class="feedback fail"><div class="fb-title">Keep Practicing</div><div class="fb-body">Don't buy a real site yet. The biggest gaps are risk identification and valuation logic. Run at least 3 more rounds before evaluating a real listing.</div></div>`}
    <div class="divider"></div>
    <div style="font-family:'Inter', sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#5F5F5F;margin-bottom:10px">Core Skills Tested</div>
    <div class="content-row"><span class="content-key">Profit multiple calculation</span><span class="content-val"><span class="tag blue">24× – 36×</span></span></div>
    <div class="content-row"><span class="content-key">Traffic diversification read</span><span class="content-val"><span class="tag blue">Google + Pinterest buffer</span></span></div>
    <div class="content-row"><span class="content-key">Content sanity check</span><span class="content-val"><span class="tag blue">PLR · Theme · Legal pages</span></span></div>
    <div class="content-row"><span class="content-key">Social engagement audit</span><span class="content-val"><span class="tag blue">Dead vs. active community</span></span></div>
  </div>
</div>
<div style="display:flex;gap:12px;flex-wrap:wrap">
  <button class="btn orange" onclick="restart()">Play Again →</button>
  <button class="btn outline" onclick="sendPrompt('I scored ${state.score}/${max} (${pct}%) on the Digital Asset Auditing Simulator. Based on my performance, what should be my next 3 steps to get ready to evaluate real niche sites on Flippa or Motion Invest?')">Get My Action Plan ↗</button>
</div>`;
}

function goAudit(){state.stage=1;renderStages();document.getElementById('main-body').innerHTML=renderStage1();}
function toggleFlag(id){if(state.flagged.has(id))state.flagged.delete(id);else state.flagged.add(id);document.getElementById('main-body').innerHTML=renderStage1();}
function setMult(m){state.multiplier=m;document.getElementById('main-body').innerHTML=renderStage2();}
function submitAudit(){state.stage=2;renderStages();document.getElementById('main-body').innerHTML=renderStage2();}
function submitVal(){
  const v=document.getElementById('val-inp');
  if(v)state.valInput=v.value;
  state.stage=3;renderStages();document.getElementById('main-body').innerHTML=renderStage3();
}
function nextRound(){
  state.round++;
  let next;
  do{next=Math.floor(Math.random()*SITES.length);}while(next===state.siteIdx&SITES.length>1);
  state.siteIdx=next;
  state.flagged=new Set();state.stage=0;state.multiplier=24;state.valInput='';
  renderStages();document.getElementById('main-body').innerHTML=renderStage0();
}
function finalScore(){document.getElementById('main-body').innerHTML=renderFinal();}
function restart(){state={siteIdx:Math.floor(Math.random()*SITES.length),flagged:new Set(),stage:0,score:0,round:1,multiplier:24,valInput:''};renderStages();updateScore();document.getElementById('main-body').innerHTML=renderStage0();}

renderStages();
document.getElementById('main-body').innerHTML=renderStage0();
</script>
